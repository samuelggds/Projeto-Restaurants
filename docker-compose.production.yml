services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB em .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER em .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env.production}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data_internal
    logging: &default-logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  osrm:
    image: ${OSRM_IMAGE:?Defina OSRM_IMAGE em .env.production}
    restart: unless-stopped
    init: true
    command: ['osrm-routed', '--algorithm', 'mld', '/data/region.osrm']
    volumes:
      - ./routing-data/osrm:/data:ro
    expose:
      - '5000'
    healthcheck:
      test: ['CMD-SHELL', "timeout 3 bash -c '</dev/tcp/127.0.0.1/5000'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - routing_internal
    logging: *default-logging

  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      PBF_PATH: /nominatim/data/region.osm.pbf
      REPLICATION_URL: ${ROUTING_REPLICATION_URL:-}
      UPDATE_MODE: ${NOMINATIM_UPDATE_MODE:-none}
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: 'false'
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?Defina NOMINATIM_PASSWORD em .env.production}
    volumes:
      - ./routing-data/osrm:/nominatim/data:ro
      - nominatim_production_data:/var/lib/postgresql/16/main
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', "curl -fsS 'http://127.0.0.1:8080/status?format=json' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 6h
    networks:
      - routing_internal
      - edge
    logging: *default-logging

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em .env.production}
      DIRECT_URL: ${DIRECT_URL:?Defina DIRECT_URL em .env.production}
      BACKEND_URL: https://${API_DOMAIN:?Defina API_DOMAIN em .env.production}
      FRONTEND_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN em .env.production}
      CORS_ORIGINS: https://${APP_DOMAIN:?Defina APP_DOMAIN em .env.production}
      SOCKET_CORS_ORIGINS: https://${APP_DOMAIN:?Defina APP_DOMAIN em .env.production}
      ROUTING_REQUIRED: 'true'
      OSRM_BASE_URL: http://osrm:5000
      GEOCODER_BASE_URL: http://nominatim:8080
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_healthy
      nominatim:
        condition: service_started
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge
      - data_internal
      - routing_internal
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${API_DOMAIN:?Defina API_DOMAIN em .env.production}
        VITE_SOCKET_URL: https://${API_DOMAIN:?Defina API_DOMAIN em .env.production}
        VITE_SOCKET_PATH: ${VITE_SOCKET_PATH:-/socket.io}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-15000}
        VITE_QR_BASE_URL: https://${APP_DOMAIN:?Defina APP_DOMAIN em .env.production}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:?Defina VITE_MAP_TILE_URL em .env.production}
        VITE_MAP_TILE_ATTRIBUTION: '${VITE_MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}'
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - '80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging: *default-logging

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN em .env.production}
      API_DOMAIN: ${API_DOMAIN:?Defina API_DOMAIN em .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL em .env.production}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging: *default-logging

volumes:
  postgres_production_data:
  nominatim_production_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  data_internal:
    internal: true
  routing_internal:
    internal: true
