services:
  backend:
    environment:
      CUSTOMER_NOTIFICATION_PROVIDER: evolution
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY em .env.production}
    depends_on:
      evolution-api:
        condition: service_healthy

  worker:
    environment:
      CUSTOMER_NOTIFICATION_PROVIDER: evolution
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY em .env.production}
    depends_on:
      evolution-api:
        condition: service_healthy

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    init: true
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY em .env.production}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD em .env.production}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: gastronexa_evolution
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: gastronexa-evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      LANGUAGE: pt-BR
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    expose:
      - '8080'
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - edge
      - evolution_internal

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Defina EVOLUTION_DB_PASSWORD em .env.production}
      POSTGRES_DB: evolution
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_internal

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evolution_internal

volumes:
  evolution_instances:
  evolution_postgres_data:

networks:
  evolution_internal:
    internal: true
