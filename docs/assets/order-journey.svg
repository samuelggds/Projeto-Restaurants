<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jornada do pedido</title><desc id="desc">Fluxo do cliente até a entrega e fidelização</desc><defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f97316"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="1200" height="320" rx="26" fill="#f8fafc"/><text x="60" y="58" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800">Uma jornada, múltiplos atores em tempo real</text><path d="M115 170H1085" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle"><g transform="translate(120 170)"><circle r="34" fill="#f97316"/><text y="8" fill="#fff" font-size="24" font-weight="800">1</text><text y="70" fill="#0f172a" font-size="17" font-weight="700">Cliente</text><text y="94" fill="#64748b" font-size="14">escolhe e personaliza</text></g><g transform="translate(360 170)"><circle r="34" fill="#f59e0b"/><text y="8" fill="#fff" font-size="24" font-weight="800">2</text><text y="70" fill="#0f172a" font-size="17" font-weight="700">Pagamento</text><text y="94" fill="#64748b" font-size="14">confirmação idempotente</text></g><g transform="translate(600 170)"><circle r="34" fill="#10b981"/><text y="8" fill="#fff" font-size="24" font-weight="800">3</text><text y="70" fill="#0f172a" font-size="17" font-weight="700">Cozinha e salão</text><text y="94" fill="#64748b" font-size="14">produção sincronizada</text></g><g transform="translate(840 170)"><circle r="34" fill="#3b82f6"/><text y="8" fill="#fff" font-size="24" font-weight="800">4</text><text y="70" fill="#0f172a" font-size="17" font-weight="700">Entrega</text><text y="94" fill="#64748b" font-size="14">GPS, rota e tracking</text></g><g transform="translate(1080 170)"><circle r="34" fill="#7c3aed"/><text y="8" fill="#fff" font-size="24" font-weight="800">5</text><text y="70" fill="#0f172a" font-size="17" font-weight="700">Fidelização</text><text y="94" fill="#64748b" font-size="14">cupons e benefícios</text></g></g>
</svg>
