  <text x="74" y="205" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="800">Pizza IA Delivery</text><rect x="74" y="232" width="510" height="7" rx="4" fill="url(#accent)"/>
  <text x="74" y="290" fill="#e5e7eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27">Da descoberta do cardápio à entrega em tempo real.</text><text x="74" y="328" fill="#9ca3af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Uma plataforma multi-restaurante para clientes, cozinha, salão,</text><text x="74" y="358" fill="#9ca3af" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">entregadores e gestão — construída com TypeScript de ponta a ponta.</text>
