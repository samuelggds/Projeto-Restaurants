<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Pizza IA Delivery</title><desc id="desc">Plataforma completa para restaurantes, mesas e delivery</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset=".55" stop-color="#2b193d"/><stop offset="1" stop-color="#7c2d12"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/><circle cx="1080" cy="70" r="190" fill="#fb923c" opacity=".08"/><circle cx="90" cy="480" r="210" fill="#a855f7" opacity=".08"/>
