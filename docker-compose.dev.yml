services:
  backend:
    image: node:22-alpine
    container_name: pizza_backend_dev
    working_dir: /app
    restart: unless-stopped
    environment: &development-backend-environment
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/pizza_ai}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@host.docker.internal:5432/pizza_ai}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ALLOW_LOCAL_AUTH_CODE_LOGGING: ${ALLOW_LOCAL_AUTH_CODE_LOGGING:-false}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY_PREVIOUS: ${CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
      SOCKET_CORS_ORIGINS: ${SOCKET_CORS_ORIGINS:-http://localhost:5174}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      MP_ORDER_NOTIFICATION_URL: ${MP_ORDER_NOTIFICATION_URL:-}
      MP_AUTO_RECONCILE_ENABLED: ${MP_AUTO_RECONCILE_ENABLED:-true}
      MP_AUTO_RECONCILE_MAX_INVOICES: ${MP_AUTO_RECONCILE_MAX_INVOICES:-50}
      MP_RECONCILE_TIMEOUT_MS: ${MP_RECONCILE_TIMEOUT_MS:-15000}
      MP_API_BASE_URL: ${MP_API_BASE_URL:-https://api.mercadopago.com}
      BILLING_MP_RECONCILE_CRON: '${BILLING_MP_RECONCILE_CRON:-*/5 * * * *}'
      LOYALTY_REDEMPTION_EXPIRATION_CRON: '${LOYALTY_REDEMPTION_EXPIRATION_CRON:-*/5 * * * *}'
      TABLE_PAYMENT_EXPIRATION_INTERVAL_MS: ${TABLE_PAYMENT_EXPIRATION_INTERVAL_MS:-60000}
      JOBS_TIMEZONE: ${JOBS_TIMEZONE:-America/Sao_Paulo}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
      ALERT_PROVIDER: ${ALERT_PROVIDER:-email}
      ALERT_TIMEOUT_MS: ${ALERT_TIMEOUT_MS:-5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    image: node:22-alpine
    container_name: pizza_worker_dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *development-backend-environment
    command: sh -c "npm install && npm run dev:worker"
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    image: node:22-alpine
    container_name: pizza_frontend_dev
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5174:5173'
