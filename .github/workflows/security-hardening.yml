name: Security Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove the scanner detects an isolated synthetic secret
        shell: bash
        run: bash scripts/test-gitleaks-canary.sh

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Audit production dependency trees
        run: |
          set -euo pipefail
          node scripts/auditNpmLockfile.mjs backend/package-lock.json --omit-dev --audit-level=high
          node scripts/auditNpmLockfile.mjs frontend/package-lock.json --omit-dev --audit-level=high
          node scripts/auditNpmLockfile.mjs print-agent/package-lock.json --omit-dev --audit-level=high

  security-regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - name: Validate production environment and readiness protections
        run: npm --prefix backend run test:production-config
      - name: Validate payment webhook, idempotency and reconciliation protections
        run: npm --prefix backend run test:refund && npm --prefix backend run test:billing

  codeql:
    name: CodeQL analysis completed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze production source and preserve SARIF
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          output: ${{ runner.temp }}/codeql-sarif
          upload: true
      - name: Test CodeQL blocking policy
        run: node --test scripts/checkCodeqlSarif.test.mjs
      - name: Enforce blocking CodeQL alert policy
        run: node scripts/checkCodeqlSarif.mjs "$RUNNER_TEMP/codeql-sarif"

  container-scan:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image from this commit
        run: docker build --pull --tag gastronexa-backend:${{ github.sha }} ./backend
      - name: Build frontend image from this commit
        run: >-
          docker build --pull
          --build-arg VITE_API_URL=http://127.0.0.1:3000
          --build-arg VITE_SOCKET_URL=http://127.0.0.1:3000
          --build-arg VITE_QR_BASE_URL=http://127.0.0.1:8080
          --build-arg VITE_MAP_TILE_URL=https://tile.openstreetmap.org/{z}/{x}/{y}.png
          --tag gastronexa-frontend:${{ github.sha }}
          ./frontend
      - name: Preserve complete backend high/critical vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-backend:${{ github.sha }}
          format: json
          output: backend-trivy-high-critical.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Preserve complete frontend high/critical vulnerability inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-frontend:${{ github.sha }}
          format: json
          output: frontend-trivy-high-critical.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      - name: Upload complete vulnerability inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-high-critical-${{ github.sha }}
          path: |
            backend-trivy-high-critical.json
            frontend-trivy-high-critical.json
          if-no-files-found: error
          retention-days: 14
      - name: Block fixable backend high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Block fixable frontend high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record immutable image identifiers
        shell: bash
        run: |
          {
            echo '### Docker images validated from this source commit'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "Backend image id: \`$(docker image inspect gastronexa-backend:${GITHUB_SHA} --format '{{.Id}}')\`"
            echo
            echo "Frontend image id: \`$(docker image inspect gastronexa-frontend:${GITHUB_SHA} --format '{{.Id}}')\`"
            echo
            echo 'The complete HIGH/CRITICAL inventory includes unfixed findings and is retained as an artifact. Fixable HIGH/CRITICAL findings remain blocking.'
          } >> "$GITHUB_STEP_SUMMARY"

  security-hardening-validation:
    name: Security Hardening Validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, dependency-audit, security-regression, codeql, container-scan]
    steps:
      - name: Require every security gate to pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const rows = Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            ['## Security hardening gates', '', '| Gate | Result |', '| --- | --- |', ...rows, ''].join('\n'),
          );
          const unsuccessful = Object.entries(jobs)
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => `${name}: ${job.result}`);
          if (unsuccessful.length) {
            console.error(`Required security gates did not pass:\n${unsuccessful.join('\n')}`);
            process.exit(1);
          }
          console.log('All required security hardening gates passed.');
          NODE
