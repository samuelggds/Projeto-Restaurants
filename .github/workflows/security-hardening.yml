name: Security Hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Audit production dependency trees
        run: |
          set -euo pipefail
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix print-agent audit --omit=dev --audit-level=high

  security-regression:
    name: Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - name: Validate production environment and readiness protections
        run: npm --prefix backend run test:production-config
      - name: Validate payment webhook, idempotency and reconciliation protections
        run: npm --prefix backend run test:refund && npm --prefix backend run test:billing

  codeql:
    name: CodeQL analysis completed
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Build application for analysis
        run: npm run build
      - name: Analyze source and preserve SARIF
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          output: ${{ runner.temp }}/codeql-sarif
          upload: true
      - name: Enforce blocking CodeQL alert policy
        shell: bash
        run: |
          set -euo pipefail
          SARIF_DIR="$RUNNER_TEMP/codeql-sarif" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.env.SARIF_DIR;
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const target = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(target);
              else if (entry.name.endsWith('.sarif')) files.push(target);
            }
          };
          walk(root);
          if (!files.length) throw new Error('CodeQL concluiu sem produzir SARIF para a política de alertas.');
          const blockers = [];
          for (const file of files) {
            const sarif = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const run of sarif.runs || []) {
              const rules = new Map((run.tool?.driver?.rules || []).map((rule) => [rule.id, rule]));
              for (const result of run.results || []) {
                const rule = rules.get(result.ruleId) || {};
                const score = Number(rule.properties?.['security-severity'] || 0);
                const level = result.level || rule.defaultConfiguration?.level || 'none';
                if (score >= 7 || level === 'error') {
                  blockers.push({ ruleId: result.ruleId, score, level });
                }
              }
            }
          }
          if (blockers.length) {
            console.error('Blocking CodeQL findings:', JSON.stringify(blockers, null, 2));
            process.exit(1);
          }
          console.log('CodeQL analysis completed and no high/critical or error-level finding matched the blocking policy.');
          NODE

  container-scan:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image from this commit
        run: docker build --pull --tag gastronexa-backend:${{ github.sha }} ./backend
      - name: Build frontend image from this commit
        run: >-
          docker build --pull
          --build-arg VITE_API_URL=http://127.0.0.1:3000
          --build-arg VITE_SOCKET_URL=http://127.0.0.1:3000
          --build-arg VITE_QR_BASE_URL=http://127.0.0.1:8080
          --build-arg VITE_MAP_TILE_URL=https://tile.openstreetmap.org/{z}/{x}/{y}.png
          --tag gastronexa-frontend:${{ github.sha }}
          ./frontend
      - name: Scan backend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastronexa-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record immutable image identifiers
        shell: bash
        run: |
          {
            echo '### Docker images validated from this source commit'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo "Backend image id: \`$(docker image inspect gastronexa-backend:${GITHUB_SHA} --format '{{.Id}}')\`"
            echo
            echo "Frontend image id: \`$(docker image inspect gastronexa-frontend:${GITHUB_SHA} --format '{{.Id}}')\`"
            echo
            echo 'Unfixed vulnerabilities are reported by Trivy but are not treated as automatically remediable; any accepted exception must be documented before release.'
          } >> "$GITHUB_STEP_SUMMARY"

  security-hardening-validation:
    name: Security Hardening Validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, dependency-audit, security-regression, codeql, container-scan]
    steps:
      - name: Require every security gate to pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const rows = Object.entries(jobs).map(([name, job]) => `| ${name} | ${job.result} |`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            ['## Security hardening gates', '', '| Gate | Result |', '| --- | --- |', ...rows, ''].join('\n'),
          );
          const unsuccessful = Object.entries(jobs)
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => `${name}: ${job.result}`);
          if (unsuccessful.length) {
            console.error(`Required security gates did not pass:\n${unsuccessful.join('\n')}`);
            process.exit(1);
          }
          console.log('All required security hardening gates passed.');
          NODE
