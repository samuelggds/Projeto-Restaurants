name: Dependency lockfile validation

on:
  push:
    branches:
      - test/payment-postgres-fault-matrix-20261020
    paths:
      - .github/workflows/dependency-lockfile-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare targeted security updates in disposable workspace
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          for (const dir of ['backend', 'frontend']) {
            const manifestPath = `${dir}/package.json`;
            const lockPath = `${dir}/package-lock.json`;
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            const before = JSON.parse(readFileSync(lockPath, 'utf8'));
            manifest.overrides = { ...manifest.overrides, 'follow-redirects': '1.16.1' };
            if (dir === 'frontend') manifest.devDependencies.vite = '8.1.6';
            writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            const update = spawnSync('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { cwd: dir, stdio: 'inherit' });
            assert.equal(update.status, 0, `${dir}: lock regeneration failed`);
            const generated = JSON.parse(readFileSync(lockPath, 'utf8'));
            let repaired;
            if (dir === 'backend') {
              repaired = structuredClone(before);
              let patched = 0;
              for (const [path, previous] of Object.entries(before.packages)) {
                if (!path.endsWith('node_modules/follow-redirects')) continue;
                const next = generated.packages[path];
                assert.equal(next?.version, '1.16.1');
                assert.ok(next.integrity?.startsWith('sha512-'));
                assert.deepEqual(next.dependencies, previous.dependencies);
                repaired.packages[path] = { ...previous, version: next.version, resolved: next.resolved, integrity: next.integrity };
                patched++;
              }
              assert.ok(patched > 0);
              for (const [path, entry] of Object.entries(before.packages)) {
                if (!path.endsWith('node_modules/follow-redirects')) assert.deepEqual(repaired.packages[path], entry);
              }
            } else {
              repaired = generated;
              assert.equal(repaired.packages[''].devDependencies.vite, '8.1.6');
              assert.equal(repaired.packages['node_modules/vite'].version, '8.1.6');
              assert.equal(repaired.packages['node_modules/follow-redirects'].version, '1.16.1');
              // Preserve existing metadata that npm would otherwise prune.
              for (const [path, previous] of Object.entries(before.packages)) {
                if (!(path in repaired.packages)) repaired.packages[path] = previous;
              }
            }
            for (const [path, next] of Object.entries(repaired.packages)) {
              const previous = before.packages[path];
              if (!previous || next.version !== previous.version || next.integrity !== previous.integrity) {
                console.log('PACKAGE_CHANGE', dir, path, JSON.stringify({ before: previous?.version, after: next.version, resolved: next.resolved, integrity: next.integrity }));
              }
            }
            writeFileSync(lockPath, JSON.stringify(repaired, null, 2) + '\n');
          }
          NODE
      - name: Validate reproducible installations without lifecycle scripts
        run: |
          npm --prefix backend ci --ignore-scripts --no-fund
          npm --prefix frontend ci --ignore-scripts --no-fund
          npm --prefix backend ls follow-redirects --all
          npm --prefix frontend ls follow-redirects vite --all
      - name: Audit all projects without changing severity gates
        run: |
          for project in backend frontend print-agent; do
            node scripts/auditNpmLockfile.mjs "$project/package-lock.json" --audit-level=high
            node scripts/auditNpmLockfile.mjs "$project/package-lock.json" --omit-dev --audit-level=high
          done
      - name: Validate frontend compatibility
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint:ci
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Record the exact patch
        if: always()
        run: |
          git diff --check
          git diff -- backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json > dependency-repair.patch
          cat dependency-repair.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-lockfiles-${{ github.sha }}
          path: |
            dependency-repair.patch
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json
          retention-days: 3
          if-no-files-found: error
