name: Dependency lockfile validation

on:
  push:
    branches:
      - test/payment-postgres-fault-matrix-20261020
    paths:
      - .github/workflows/dependency-lockfile-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare and verify targeted lockfiles in the disposable workspace
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          for (const dir of ['backend', 'frontend']) {
            const manifestPath = `${dir}/package.json`;
            const lockPath = `${dir}/package-lock.json`;
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            const before = JSON.parse(readFileSync(lockPath, 'utf8'));
            manifest.overrides = { ...manifest.overrides, 'follow-redirects': '1.16.1' };
            writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            const update = spawnSync('npm', ['install', '--package-lock-only', '--ignore-scripts', '--no-audit', '--no-fund'], { cwd: dir, stdio: 'inherit' });
            assert.equal(update.status, 0, `${dir}: lock regeneration failed`);
            const after = JSON.parse(readFileSync(lockPath, 'utf8'));
            const paths = new Set([...Object.keys(before.packages), ...Object.keys(after.packages)]);
            let patched = 0;
            for (const path of paths) {
              if (!path) continue;
              if (path.endsWith('node_modules/follow-redirects')) {
                assert.equal(after.packages[path]?.version, '1.16.1');
                assert.ok(after.packages[path].integrity);
                console.log('PATCHED_PACKAGE', dir, path, JSON.stringify(after.packages[path]));
                patched++;
              } else {
                assert.equal(after.packages[path]?.version, before.packages[path]?.version, `Unrelated dependency changed: ${dir}/${path}`);
                assert.equal(after.packages[path]?.resolved, before.packages[path]?.resolved, `Unrelated source changed: ${dir}/${path}`);
                assert.equal(after.packages[path]?.integrity, before.packages[path]?.integrity, `Unrelated integrity changed: ${dir}/${path}`);
              }
            }
            assert.ok(patched > 0, `${dir}: package not found`);
          }
          NODE
      - name: Validate reproducible installations without lifecycle scripts
        run: |
          npm --prefix backend ci --ignore-scripts --no-fund
          npm --prefix frontend ci --ignore-scripts --no-fund
          npm --prefix backend ls follow-redirects --all
          npm --prefix frontend ls follow-redirects --all
      - name: Audit without changing severity gates
        run: |
          for project in backend frontend print-agent; do
            node scripts/auditNpmLockfile.mjs "$project/package-lock.json" --audit-level=high
            node scripts/auditNpmLockfile.mjs "$project/package-lock.json" --omit-dev --audit-level=high
          done
      - name: Record the exact patch
        run: |
          git diff --check
          git diff -- backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json > dependency-repair.patch
          cat dependency-repair.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-dependency-lockfiles-${{ github.sha }}
          path: |
            dependency-repair.patch
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json
          retention-days: 3
          if-no-files-found: error
