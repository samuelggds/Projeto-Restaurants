name: Repair PR 375 dependency audit
on:
  push:
    branches:
      - fix/admin-login-tenant-branding-20261023
    paths:
      - .github/workflows/repair-pr375-dependencies.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'samuelggds/Projeto-Restaurants'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update dependencies with authentic npm lockfile metadata
        run: |
          set -euo pipefail
          cd backend
          npm pkg set 'overrides.body-parser=^2.4.0' 'overrides.ip-address=^10.7.4'
          npm install 'zod@^4.6.6' --package-lock-only --ignore-scripts --no-audit
          cd ../frontend
          npm pkg set 'overrides.zod=^4.6.6'
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify package installation and compatibility
        run: |
          set -euo pipefail
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix backend run typecheck
          npm --prefix frontend run typecheck
          node scripts/auditNpmLockfile.mjs backend/package-lock.json --audit-level=high
          node scripts/auditNpmLockfile.mjs frontend/package-lock.json --audit-level=high
      - name: Commit changes to PR branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): regenerate npm lockfiles for vulnerable dependencies'
            git push origin HEAD:fix/admin-login-tenant-branding-20261023
          fi
