name: Payment Sandbox Preflight

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provedor de teste a validar (não executa cobrança)
        type: choice
        required: true
        default: mercado-pago
        options: [mercado-pago, asaas, pagarme]

permissions:
  contents: read

jobs:
  contracts:
    name: Local payment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run test:refund && npm --prefix backend run test:billing

  official-sandboxes:
    name: Official provider sandbox preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: payment-sandbox
    steps:
      - name: Mercado Pago sandbox/test credential preflight
        if: inputs.provider == 'mercado-pago'
        env:
          TOKEN: ${{ secrets.MERCADO_PAGO_SANDBOX_TOKEN }}
          TEST_ACCOUNT_ID: ${{ vars.MERCADO_PAGO_SANDBOX_USER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo '- Mercado Pago: NÃO EXECUTADO / PENDENTE — credencial de teste ausente.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            case "$TOKEN" in TEST-*|APP_USR-*) ;; *) echo 'Use exclusivamente a credencial de teste do Mercado Pago.' >&2; exit 1 ;; esac
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/mp.json" --write-out '%{http_code}' \
              --max-time 15 -H "Authorization: Bearer $TOKEN" https://api.mercadopago.com/users/me)"
            test "$code" = '200'
            # Orders test credentials can also start with APP_USR. Prefix alone
            # must never be treated as proof that an account is a test account.
            if [[ "$TOKEN" == APP_USR-* ]]; then
              [[ "$TEST_ACCOUNT_ID" =~ ^[0-9]+$ ]]
              jq -e --arg id "$TEST_ACCOUNT_ID" '(.id | tostring) == $id and ((.tags // []) | index("test_user") != null)' "$RUNNER_TEMP/mp.json" >/dev/null
            fi
            echo '- Mercado Pago: autenticação de credencial de teste validada em chamada somente leitura. Fluxo completo de pagamento sandbox continua separado.' >> "$GITHUB_STEP_SUMMARY"
          fi


      - name: Asaas sandbox preflight
        if: inputs.provider == 'asaas'
        env:
          TOKEN: ${{ secrets.ASAAS_SANDBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo '- Asaas: NÃO EXECUTADO / PENDENTE — chave sandbox ausente.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            case "$TOKEN" in '$aact_hmlg_'*) ;; *) echo 'A chave fornecida não possui prefixo de Sandbox do Asaas.' >&2; exit 1 ;; esac
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/asaas.json" --write-out '%{http_code}' \
              --max-time 15 \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: GastroNexa-CI/1.0 (sandbox)' \
              -H "access_token: $TOKEN" \
              'https://api-sandbox.asaas.com/v3/customers?limit=1')"
            test "$code" = '200'
            echo '- Asaas: autenticação sandbox validada em chamada somente leitura. Isso não substitui homologação de pagamento/webhook.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pagar.me future integration preflight
        if: inputs.provider == 'pagarme'
        shell: bash
        run: |
          set -euo pipefail
          echo '- Pagar.me: integração preparada no código, porém bloqueada por ENABLE_FUTURE_PAYMENT_PROVIDERS=false até cadastro empresarial/CNPJ e homologação.' >> "$GITHUB_STEP_SUMMARY"

      - name: Clarify sandbox scope
        run: |
          {
            echo
            echo 'Este workflow faz consultas somente leitura; Mercado Pago usa a API oficial com credencial de teste. Não cria pagamentos.'
            echo 'Provedores não selecionados não foram validados. Asaas e Pagar.me permanecem desativados até homologação própria.'
            echo 'Presença de segredo por si só não é registrada como integração homologada.'
          } >> "$GITHUB_STEP_SUMMARY"
