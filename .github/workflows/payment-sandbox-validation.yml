name: Payment Sandbox Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Local payment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix backend run test:refund && npm --prefix backend run test:billing

  official-sandboxes:
    name: Official provider sandbox preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: payment-sandbox
    steps:
      - name: Mercado Pago sandbox/test credential preflight
        env:
          TOKEN: ${{ secrets.MERCADO_PAGO_SANDBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo '- Mercado Pago: NÃO EXECUTADO / PENDENTE — credencial de teste ausente.' >> "$GITHUB_STEP_SUMMARY"
          else
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/mp.json" --write-out '%{http_code}' \
              --max-time 15 -H "Authorization: Bearer $TOKEN" https://api.mercadopago.com/users/me)"
            test "$code" = '200'
            echo '- Mercado Pago: autenticação de credencial de teste validada em chamada somente leitura. Fluxo completo de pagamento sandbox continua separado.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: PagBank sandbox preflight
        env:
          TOKEN: ${{ secrets.PAGBANK_SANDBOX_TOKEN }}
          ACCOUNT_ID: ${{ vars.PAGBANK_SANDBOX_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo '- PagBank: NÃO EXECUTADO / PENDENTE — token sandbox e/ou account id ausente.' >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$ACCOUNT_ID" =~ ^ACCO_[A-Za-z0-9_-]+$ ]]
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/pagbank.json" --write-out '%{http_code}' \
              --max-time 15 -H "Authorization: Bearer $TOKEN" \
              "https://sandbox.api.pagseguro.com/accounts/$ACCOUNT_ID")"
            test "$code" = '200'
            echo '- PagBank: autenticação/consulta de conta sandbox validada em chamada somente leitura. Isso não substitui homologação de pagamento.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Asaas sandbox preflight
        env:
          TOKEN: ${{ secrets.ASAAS_SANDBOX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo '- Asaas: NÃO EXECUTADO / PENDENTE — chave sandbox ausente.' >> "$GITHUB_STEP_SUMMARY"
          else
            case "$TOKEN" in '$aact_hmlg_'*) ;; *) echo 'A chave fornecida não possui prefixo de Sandbox do Asaas.' >&2; exit 1 ;; esac
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/asaas.json" --write-out '%{http_code}' \
              --max-time 15 \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: GastroNexa-CI/1.0 (sandbox)' \
              -H "access_token: $TOKEN" \
              'https://api-sandbox.asaas.com/v3/customers?limit=1')"
            test "$code" = '200'
            echo '- Asaas: autenticação sandbox validada em chamada somente leitura. Isso não substitui homologação de pagamento/webhook.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clarify sandbox scope
        run: |
          {
            echo
            echo 'Este workflow nunca usa endpoints de produção e não cria cobranças reais.'
            echo 'Presença de segredo por si só não é registrada como integração homologada.'
          } >> "$GITHUB_STEP_SUMMARY"
