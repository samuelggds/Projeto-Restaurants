name: Isolated Stack Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: Frontend backend worker PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate compose model
        run: docker compose -f docker-compose.ci.yml config --quiet

      - name: Build approved source images
        run: docker compose -f docker-compose.ci.yml build --pull

      - name: Start disposable isolated stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            backend_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose -f docker-compose.ci.yml ps -q backend)" 2>/dev/null || true)"
            frontend_status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose -f docker-compose.ci.yml ps -q frontend)" 2>/dev/null || true)"
            worker_status="$(docker inspect --format='{{.State.Status}}' "$(docker compose -f docker-compose.ci.yml ps -q worker)" 2>/dev/null || true)"
            if [ "$backend_status" = healthy ] && [ "$frontend_status" = healthy ] && [ "$worker_status" = running ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.ci.yml ps
          exit 1

      - name: Verify restricted runtime database role
        shell: bash
        run: |
          set -euo pipefail
          secure_role="$(docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U ci_owner -d gastronexa_ci -Atc \
            "SELECT (NOT rolsuper AND NOT rolbypassrls AND NOT rolcreatedb AND NOT rolcreaterole)::text FROM pg_roles WHERE rolname='ci_runtime'")"
          test "$secure_role" = 'true'
          backend_role="$(docker compose -f docker-compose.ci.yml exec -T backend node -e \
            "import('./dist/config/prisma.js').then(async m=>{const r=await m.default.\$queryRawUnsafe('select current_user as u'); console.log(r[0].u); await m.default.\$disconnect()})")"
          test "$(printf '%s' "$backend_role" | tail -n 1)" = 'ci_runtime'

      - name: Install host test dependencies for real integrated journey
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          (cd frontend && npx playwright install --with-deps chromium)

      - name: Seed disposable tenant fixtures through the migration owner only
        env:
          NODE_ENV: test
          CI_INTEGRATION_OWNER_DATABASE_URL: postgresql://ci_owner:ci-owner-password@127.0.0.1:5432/gastronexa_ci?schema=public
        shell: bash
        run: |
          set -euo pipefail
          node backend/scripts/seedIntegratedCi.mjs > "$RUNNER_TEMP/integrated-fixture.json"
          FIXTURE_FILE="$RUNNER_TEMP/integrated-fixture.json" node <<'NODE'
          const fs = require('fs');
          const fixture = JSON.parse(fs.readFileSync(process.env.FIXTURE_FILE, 'utf8'));
          const pairs = {
            CI_RESTAURANT_A_ID: fixture.restaurantAId,
            CI_RESTAURANT_B_ID: fixture.restaurantBId,
            CI_PRODUCT_A_ID: fixture.productAId,
            CI_ATTENDANT_A_EMAIL: fixture.emails.attendantA,
            CI_KITCHEN_A_EMAIL: fixture.emails.kitchenA,
            CI_ATTENDANT_B_EMAIL: fixture.emails.attendantB,
            CI_STAFF_PASSWORD: fixture.password,
          };
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(pairs).map(([k,v]) => `${k}=${v}`).join('\n') + '\n');
          NODE
          rm -f "$RUNNER_TEMP/integrated-fixture.json"

      - name: Run real browser API PostgreSQL authorization and order journey
        working-directory: frontend
        env:
          PLAYWRIGHT_EXTERNAL_BASE_URL: http://localhost:8080
          CI_INTEGRATED_API_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set -o pipefail
          npx playwright test e2e/integrated-stack.spec.ts --project=chromium 2>&1 | tee ../integrated-stack-browser.log

      - name: Verify browser-created order persisted with the advanced status
        shell: bash
        run: |
          set -euo pipefail
          matching="$(docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U ci_owner -d gastronexa_ci -Atc \
            "SELECT count(*) FROM \"Order\" WHERE \"restaurantId\"=${CI_RESTAURANT_A_ID} AND status='PREPARANDO'")"
          test "$matching" -ge 1

      - name: Verify worker actually completes a scheduled task
        shell: bash
        run: |
          set -euo pipefail
          completed='0'
          for attempt in $(seq 1 30); do
            completed="$(docker compose -f docker-compose.ci.yml exec -T postgres \
              psql -U ci_owner -d gastronexa_ci -Atc \
              "SELECT count(*) FROM \"ScheduledJobState\" WHERE \"jobKey\" IN ('sales-leads.email-delivery','notifications.delivery') AND \"lastStartedAt\" IS NOT NULL AND \"lastCompletedAt\" IS NOT NULL")"
            if [ "$completed" -ge 1 ]; then break; fi
            sleep 2
          done
          test "$completed" -ge 1

      - name: Smoke backend readiness and frontend delivery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3000/ready > "$RUNNER_TEMP/backend-ready.json"
          curl --fail --silent --show-error http://127.0.0.1:8080/ > "$RUNNER_TEMP/frontend-index.html"
          grep -qi '<html' "$RUNNER_TEMP/frontend-index.html"

      - name: Record image ids and commit evidence
        shell: bash
        run: |
          {
            echo '### Isolated stack image evidence'
            echo
            for service in backend worker frontend; do
              container_id="$(docker compose -f docker-compose.ci.yml ps -q "$service")"
              image_id="$(docker inspect --format='{{.Image}}' "$container_id")"
              echo "- ${service}: \`${image_id}\`"
            done
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Verified: restricted runtime DB role, browser->API->PostgreSQL login/authorization/order transition, and actual worker scheduled-task completion.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture stack logs
        if: always()
        shell: bash
        run: docker compose -f docker-compose.ci.yml logs --no-color > "$RUNNER_TEMP/isolated-stack.log" 2>&1 || true

      - name: Upload stack diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-stack-${{ github.sha }}
          path: |
            ${{ runner.temp }}/isolated-stack.log
            ${{ runner.temp }}/backend-ready.json
            integrated-stack-browser.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down disposable stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  isolated-stack-validation:
    name: Isolated Stack Smoke Validation
    if: ${{ always() }}
    needs: [stack]
    runs-on: ubuntu-latest
    steps:
      - name: Require integrated stack validation to pass
        env:
          STACK_RESULT: ${{ needs.stack.result }}
        run: |
          set -euo pipefail
          test "$STACK_RESULT" = 'success'
