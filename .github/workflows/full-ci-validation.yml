name: Full Root CI Validation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'frontend/e2e/**'
      - '.github/workflows/readme-screenshots.yml'
      - '.github/workflows/full-ci-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'frontend/e2e/**'
      - '.github/workflows/readme-screenshots.yml'
      - '.github/workflows/full-ci-validation.yml'

concurrency:
  group: full-root-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: npm run ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run complete root CI
        run: npm run ci
