name: CI

on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

# Cancel previous runs on the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - name: Check architecture constraints
        run: npm run check:architecture

      - name: Check operational script catalog and guards
        run: npm run check:scripts

  # ─────────────────────────────────────────────
  # 1. LINT — ESLint with zero warnings allowed
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: ESLint backend and frontend (fail on warnings)
        run: npm run lint

  # ─────────────────────────────────────────────
  # 2. TYPE CHECK — tsc --noEmit (backend + frontend)
  # ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma validate

      - name: Apply migrations on a clean database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma migrate deploy

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

  # ─────────────────────────────────────────────
  # 3. TESTS — regras e contratos na camada mais baixa possível
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Inject required secrets as env vars for integration tests.
    # Add repository secrets (Settings > Secrets) and reference them here:
    # env:
    #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
    #   JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run all discovered backend tests
        shell: bash
        run: |
          set -o pipefail
          npm --prefix backend test 2>&1 | tee backend-test.log

      - name: Upload backend test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Run frontend tests with coverage thresholds
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run test:coverage 2>&1 | tee frontend-test.log

      - name: Upload frontend coverage log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test.log
          if-no-files-found: error
          retention-days: 3

  # Somente jornadas que atravessam várias telas permanecem no E2E obrigatório.
  e2e-critical:
    name: Critical E2E journeys
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E journeys
        run: npm --prefix frontend run test:e2e:critical

  # ─────────────────────────────────────────────
  # 4. SECURITY AUDIT — npm audit (high+)
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit backend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix backend audit --audit-level=high

      - name: Audit frontend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix frontend audit --audit-level=high

  # ─────────────────────────────────────────────
  # 5. BUILD — vite build + tsup (only after all checks pass)
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, lint, typecheck, test, e2e-critical, audit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build backend (tsup)
        run: npm --prefix backend run build

      - name: Build frontend (Vite)
        run: npm --prefix frontend run build

      - name: Enforce frontend bundle budget
        run: npm run check:bundle
