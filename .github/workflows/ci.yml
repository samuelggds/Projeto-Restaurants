name: CI

on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

permissions:
  contents: read
  checks: read

# Cancel previous runs on the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Check architecture constraints
        run: npm run check:architecture
      - name: Check resolved production deployment isolation
        run: node scripts/verifyProductionCompose.mjs

      - name: Check production CSP and embedded preview isolation
        shell: bash
        run: |
          docker pull caddy:2.11.4-alpine
          caddy_container=$(docker create caddy:2.11.4-alpine)
          trap 'docker rm "$caddy_container" >/dev/null' EXIT
          docker cp "$caddy_container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          CADDY_BIN="$RUNNER_TEMP/caddy" node scripts/verifyFrontendHeaders.mjs

      - name: Check operational script catalog and guards
        run: npm run check:scripts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci
      - name: ESLint backend and frontend (fail on warnings)
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci
      - name: Typecheck backend
        run: npm --prefix backend run typecheck
      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma validate
      - name: Apply migrations on a clean database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma migrate deploy
      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck
      - name: Typecheck Print Agent
        run: npm --prefix print-agent run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci
      - name: Run all discovered backend tests
        shell: bash
        run: |
          set -o pipefail
          npm --prefix backend test 2>&1 | tee backend-test.log
      - name: Upload backend test log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Run frontend tests with coverage thresholds
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run test:coverage 2>&1 | tee frontend-test.log
      - name: Upload frontend coverage log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-log
          path: frontend-test.log
          if-no-files-found: error
          retention-days: 3
      - name: Run Print Agent tests without hardware
        run: npm --prefix print-agent test

  multitenant-security-e2e:
    name: Multi-tenant security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenant_e2e_owner
          POSTGRES_PASSWORD: tenant-e2e-owner-password
          POSTGRES_DB: tenant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_e2e_owner -d tenant_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_E2E_OWNER_DATABASE_URL: postgresql://tenant_e2e_owner:tenant-e2e-owner-password@127.0.0.1:5432/tenant_e2e?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Apply migrations and run real tenant isolation suite
        run: npm run test:e2e:tenant

  rls-security-e2e:
    name: PostgreSQL RLS security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenant_e2e_owner
          POSTGRES_PASSWORD: tenant-e2e-owner-password
          POSTGRES_DB: tenant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_e2e_owner -d tenant_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_E2E_OWNER_DATABASE_URL: postgresql://tenant_e2e_owner:tenant-e2e-owner-password@127.0.0.1:5432/tenant_e2e?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Apply migrations and run PostgreSQL RLS suite
        run: npm run test:e2e:rls

  e2e-critical:
    name: Critical E2E journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run critical E2E journeys
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run test:e2e:critical 2>&1 | tee critical-e2e.log
      - name: Upload critical E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-e2e-diagnostics
          path: |
            critical-e2e.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 3

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Audit backend packages
        run: npm --prefix backend audit --audit-level=high
      - name: Audit frontend packages
        run: npm --prefix frontend audit --audit-level=high
      - name: Audit Print Agent packages
        run: npm --prefix print-agent audit --audit-level=high

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Block newly introduced high or critical dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      [
        quality,
        lint,
        typecheck,
        test,
        multitenant-security-e2e,
        rls-security-e2e,
        e2e-critical,
        audit,
      ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Build backend (tsup)
        run: npm --prefix backend run build
      - name: Build frontend (Vite)
        run: npm --prefix frontend run build
      - name: Lint and build Print Agent
        run: npm --prefix print-agent run lint && npm --prefix print-agent run build
      - name: Enforce frontend bundle budget
        run: npm run check:bundle

  full-root-ci-validation:
    name: Full Root CI Validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - quality
      - lint
      - typecheck
      - test
      - multitenant-security-e2e
      - rls-security-e2e
      - e2e-critical
      - audit
      - dependency-review
      - build
    steps:
      - name: Require every internal CI gate to pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const rows = [];
          const unsuccessful = [];

          for (const [name, job] of Object.entries(jobs)) {
            const allowedSkip = name === 'dependency-review' && job.result === 'skipped';
            const ok = job.result === 'success' || allowedSkip;
            rows.push(`| ${name} | ${job.result} | ${ok ? 'PASS' : 'FAIL'} |`);
            if (!ok) unsuccessful.push(`${name}: ${job.result}`);
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            ['## Internal CI gates', '', '| Gate | Result | Policy |', '| --- | --- | --- |', ...rows, ''].join('\n'),
          );

          if (unsuccessful.length > 0) {
            console.error(`Required CI gates did not pass:\n${unsuccessful.join('\n')}`);
            process.exit(1);
          }
          console.log('All required internal CI gates passed.');
          NODE

      - name: Require same-commit cross-workflow production gates
        if: >-
          (github.event_name == 'pull_request' && github.base_ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'Security Hardening Validation'
            'Isolated Stack Smoke Validation'
            'Cross-browser Critical Validation'
            'Migration Compatibility Validation'
          )

          for attempt in $(seq 1 120); do
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
              > "$RUNNER_TEMP/check-runs.json"

            result="$(CHECKS_FILE="$RUNNER_TEMP/check-runs.json" node - "${required[@]}" <<'NODE'
          const fs = require('fs');
          const required = process.argv.slice(2);
          const checks = JSON.parse(fs.readFileSync(process.env.CHECKS_FILE, 'utf8')).check_runs || [];
          const pending = [];
          const failed = [];

          for (const name of required) {
            const matching = checks
              .filter((check) => check.name === name)
              .sort((a, b) => new Date(b.started_at || b.created_at || 0) - new Date(a.started_at || a.created_at || 0));
            const latest = matching[0];
            if (!latest || latest.status !== 'completed') {
              pending.push(name);
              continue;
            }
            if (latest.conclusion !== 'success') {
              failed.push(`${name}: ${latest.conclusion || 'unknown'}`);
            }
          }

          if (failed.length) {
            process.stdout.write(`failed:${failed.join('|')}`);
          } else if (pending.length) {
            process.stdout.write(`pending:${pending.join('|')}`);
          } else {
            process.stdout.write('success');
          }
          NODE
            )"

            case "$result" in
              success)
                {
                  echo '## Cross-workflow production gates'
                  echo
                  for gate in "${required[@]}"; do
                    echo "- ✅ ${gate}"
                  done
                } >> "$GITHUB_STEP_SUMMARY"
                echo 'All same-commit cross-workflow production gates passed.'
                exit 0
                ;;
              failed:*)
                echo "Cross-workflow gate failure: ${result#failed:}" >&2
                exit 1
                ;;
              pending:*)
                echo "Waiting for: ${result#pending:}"
                sleep 10
                ;;
              *)
                echo "Unexpected gate status: $result" >&2
                exit 1
                ;;
            esac
          done

          echo 'Timed out waiting for cross-workflow production gates.' >&2
          exit 1
