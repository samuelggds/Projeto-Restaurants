name: CI

on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

# Cancel previous runs on the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix print-agent ci
      - name: Check architecture constraints
        run: npm run check:architecture

      - name: Check operational script catalog and guards
        run: npm run check:scripts

  # ─────────────────────────────────────────────
  # 1. LINT — ESLint with zero warnings allowed
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci

      - name: ESLint backend and frontend (fail on warnings)
        run: npm run lint

  # ─────────────────────────────────────────────
  # 2. TYPE CHECK — tsc --noEmit (backend + frontend)
  # ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma validate

      - name: Apply migrations on a clean database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma migrate deploy

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Typecheck Print Agent
        run: npm --prefix print-agent run typecheck

  # ─────────────────────────────────────────────
  # 3. TESTS — regras e contratos na camada mais baixa possível
  # ─────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Inject required secrets as env vars for integration tests.
    # Add repository secrets (Settings > Secrets) and reference them here:
    # env:
    #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
    #   JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci

      - name: Run all discovered backend tests
        shell: bash
        run: |
          set -o pipefail
          npm --prefix backend test 2>&1 | tee backend-test.log

      - name: Upload backend test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Run frontend tests with coverage thresholds
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run test:coverage 2>&1 | tee frontend-test.log

      - name: Upload frontend coverage log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: frontend-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Run Print Agent tests without hardware
        run: npm --prefix print-agent test

  # Banco limpo + servidor Express/Socket.IO real. Este job não usa o banco
  # compartilhado de desenvolvimento e falha diante de qualquer vazamento A -> B.
  multitenant-security-e2e:
    name: Multi-tenant security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenant_e2e_owner
          POSTGRES_PASSWORD: tenant-e2e-owner-password
          POSTGRES_DB: tenant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_e2e_owner -d tenant_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_E2E_OWNER_DATABASE_URL: postgresql://tenant_e2e_owner:tenant-e2e-owner-password@127.0.0.1:5432/tenant_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Apply migrations and run real tenant isolation suite
        run: npm run test:e2e:tenant

  # Gate dedicado às policies do PostgreSQL. Mantê-lo separado impede que
  # regressões de RLS fiquem escondidas por uma suíte multi-tenant mais ampla.
  rls-security-e2e:
    name: PostgreSQL RLS security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenant_e2e_owner
          POSTGRES_PASSWORD: tenant-e2e-owner-password
          POSTGRES_DB: tenant_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenant_e2e_owner -d tenant_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TENANT_E2E_OWNER_DATABASE_URL: postgresql://tenant_e2e_owner:tenant-e2e-owner-password@127.0.0.1:5432/tenant_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Apply migrations and run PostgreSQL RLS suite
        run: npm run test:e2e:rls

  # Somente jornadas que atravessam várias telas permanecem no E2E obrigatório.
  e2e-critical:
    name: Critical E2E journeys
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E journeys
        run: npm --prefix frontend run test:e2e:critical

  # ─────────────────────────────────────────────
  # 4. SECURITY AUDIT — npm audit (high+)
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci

      - name: Audit backend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix backend audit --audit-level=high

      - name: Audit frontend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix frontend audit --audit-level=high

      - name: Audit Print Agent packages
        run: npm --prefix print-agent audit --audit-level=high

  # ─────────────────────────────────────────────
  # 5. BUILD — vite build + tsup (only after all checks pass)
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      [
        quality,
        lint,
        typecheck,
        test,
        multitenant-security-e2e,
        rls-security-e2e,
        e2e-critical,
        audit,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            print-agent/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Print Agent dependencies
        run: npm --prefix print-agent ci

      - name: Build backend (tsup)
        run: npm --prefix backend run build

      - name: Build frontend (Vite)
        run: npm --prefix frontend run build

      - name: Lint and build Print Agent
        run: npm --prefix print-agent run lint && npm --prefix print-agent run build

      - name: Enforce frontend bundle budget
        run: npm run check:bundle

  full-root-ci-validation:
    name: Full Root CI Validation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - quality
      - lint
      - typecheck
      - test
      - multitenant-security-e2e
      - rls-security-e2e
      - e2e-critical
      - audit
      - build
    steps:
      - name: Require every CI gate to pass
        env:
          JOB_RESULTS: ${{ toJson(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const unsuccessful = Object.entries(jobs)
            .filter(([, job]) => job.result !== 'success')
            .map(([name, job]) => `${name}: ${job.result}`);

          if (unsuccessful.length > 0) {
            console.error(`Required CI gates did not pass:\n${unsuccessful.join('\n')}`);
            process.exit(1);
          }

          console.log('All required CI gates passed.');
          NODE
