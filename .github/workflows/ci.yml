name: CI

on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

# Cancel previous runs on the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. LINT — ESLint with zero warnings allowed
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: ESLint (fail on warnings)
        run: npm --prefix frontend run lint:ci

  # ─────────────────────────────────────────────
  # 2. TYPE CHECK — tsc --noEmit (backend + frontend)
  # ─────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Typecheck backend
        run: npm --prefix backend run typecheck

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validation
        run: npx prisma validate

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

  # ─────────────────────────────────────────────
  # 3. TESTS — Vitest with coverage (frontend)
  #            + Node test runner (backend)
  # ─────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    # Inject required secrets as env vars for integration tests.
    # Add repository secrets (Settings > Secrets) and reference them here:
    # env:
    #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
    #   JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run backend tests
        run: npm --prefix backend run test

      - name: Run frontend tests with coverage (Vitest)
        run: npm --prefix frontend run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage/
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # 4. SECURITY AUDIT — npm audit (high+)
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit backend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix backend audit --audit-level=critical

      - name: Audit frontend packages
        # react-router GHSA-qwww-vcr4-c8h2 is RSC-only; this is a Vite SPA — not affected
        run: npm --prefix frontend audit --audit-level=critical

  # ─────────────────────────────────────────────
  # 5. BUILD — vite build + tsup (only after all checks pass)
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build backend (tsup)
        run: npm --prefix backend run build

      - name: Build frontend (Vite)
        run: npm --prefix frontend run build
