name: README Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/playwright.config.ts'
      - 'frontend/vite.config.ts'
      - '.github/workflows/readme-screenshots.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/playwright.config.ts'
      - 'frontend/vite.config.ts'
      - '.github/workflows/readme-screenshots.yml'

permissions:
  contents: read

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture real project UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots from real E2E flows
        id: capture
        working-directory: frontend
        env:
          CAPTURE_README_SCREENSHOTS: 'true'
          README_SCREENSHOT_OUTPUT_DIR: ${{ runner.temp }}/readme-screenshots
        run: >-
          npx playwright test
          e2e/login-mobile-responsive.spec.ts
          e2e/admin-promotions.spec.ts
          e2e/waiter-operations.spec.ts
          e2e/kitchen-order-customizations.spec.ts
          e2e/courier-operations.spec.ts
          e2e/readme-real-ui.spec.ts

      - name: Upload refreshed README screenshots
        id: screenshots
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/readme-screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Explain how to update the README
        shell: bash
        env:
          SCREENSHOTS_URL: ${{ steps.screenshots.outputs.artifact-url }}
        run: |
          {
            printf '### README screenshots\n\n'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf '[Download the screenshots](%s) (retained for 30 days).\n\n' "$SCREENSHOTS_URL"
            printf 'To update the README, extract the PNG files into `docs/assets/screenshots/` on a branch, review them, and open a pull request to `main`. Merge after `Full Root CI Validation` passes.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed capture diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots-failure-${{ github.sha }}
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
