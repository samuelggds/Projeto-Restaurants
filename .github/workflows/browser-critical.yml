name: Cross-browser Critical

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/post-merge-improvements-20261013, fix/admin-order-detail-reference-20261013]

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable-browser:
    name: Portable critical - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
      # The official image runs as root; Firefox requires an owned HOME.
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install selected browser engine
        working-directory: frontend
        run: npx playwright install ${{ matrix.browser }}
      - name: Run portable critical journeys
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test \
            --project='${{ matrix.browser }}' \
            e2e/browser-portable.spec.ts \
            e2e/promotional-coupons.spec.ts \
            e2e/marketing-landing.spec.ts \
            e2e/help-preview-scroll.spec.ts \
            e2e/admin-billing-ux.spec.ts \
            e2e/admin-settings-inputs.spec.ts \
            e2e/admin-payment-connections.spec.ts \
            --grep-invert='logo GX preserva transparência real|deslizar a prévia sem acionar os controles' \
            2>&1 | tee "../cross-browser-${{ matrix.browser }}.log"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            cross-browser-${{ matrix.browser }}.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  catalog-webkit-regression:
    name: Catalog product wizard and grid - WebKit
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install WebKit and its Linux dependencies
        working-directory: frontend
        run: npx playwright install webkit
      - name: Verify catalog wizard and card layout without skipping tests
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/admin-catalog-reference.spec.ts --project=webkit 2>&1 | tee ../catalog-webkit-regression.log
      - name: Preserve WebKit catalog traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-webkit-regression-${{ github.sha }}
          path: |
            catalog-webkit-regression.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  catalog-other-engines:
    name: Catalog product wizard and grid - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
      # The official image runs as root; Firefox requires an owned HOME.
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install selected browser engine
        working-directory: frontend
        run: npx playwright install ${{ matrix.browser }}
      - name: Verify full catalog workflow in selected browser
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/admin-catalog-reference.spec.ts --project='${{ matrix.browser }}' 2>&1 | tee "../catalog-${{ matrix.browser }}.log"
      - name: Preserve catalog browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-${{ matrix.browser }}-${{ github.sha }}
          path: |
            catalog-${{ matrix.browser }}.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  catalog-repeatability:
    name: WebKit catalog and billing repeatability
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install WebKit and its Linux dependencies
        working-directory: frontend
        run: npx playwright install webkit
      - name: Exercise previously unstable catalog and sidebar interactions three times
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test e2e/admin-catalog-reference.spec.ts e2e/admin-billing-ux.spec.ts \
            --project=webkit \
            --grep='preço meio a meio dispensa valor fixo|menu lateral da Central Financeira recolhe e reabre|central financeira mantém navegação e layout mobile' \
            --repeat-each=3 \
            2>&1 | tee ../webkit-repeatability.log
      - name: Preserve WebKit repeatability traces and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-repeatability-${{ github.sha }}
          path: |
            webkit-repeatability.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  webkit-mobile-crash-isolation:
    name: WebKit mobile catalog - isolated processes
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install WebKit and Linux dependencies
        working-directory: frontend
        run: npx playwright install webkit
      - name: Enable WebKit crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-default}"
          ulimit -c unlimited || true
          echo "Runner operating system and memory"
          uname -a
          free -m
          echo "Kernel crash indicators before run"
          (dmesg | tail -35) || true
      - name: Verify mobile catalog three times in isolated Playwright processes
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          # Each iteration starts a fresh test runner/browser. Never treat a
          # subsequent success as a retry: ANY failed iteration fails the job.
          failures=0
          for iteration in 1 2 3; do
            echo "::group::Isolated WebKit mobile attempt ${iteration}"
            echo "Runner memory before iteration ${iteration}"
            free -m
            if npx playwright test e2e/admin-catalog-reference.spec.ts \
              --project=webkit \
              --grep='preço meio a meio dispensa valor fixo no cadastro em 390px' \
              --output="test-results/mobile-isolated-${iteration}" \
              > "../webkit-mobile-isolated-${iteration}.log" 2>&1; then
              echo "Isolated iteration ${iteration}: PASS"
            else
              echo "Isolated iteration ${iteration}: FAIL"
              failures=$((failures + 1))
            fi
            cat "../webkit-mobile-isolated-${iteration}.log"
            echo "Runner memory after iteration ${iteration}"
            free -m
            ps -eo pid,ppid,rss,stat,comm --sort=-rss | head -25 || true
            echo "Relevant process crash reports"
            (journalctl -k --no-pager -n 45 || true) | grep -Ei 'webkit|oom|segfault|killed process|memory' || true
            echo "::endgroup::"
          done
          test "$failures" -eq 0
      - name: Preserve isolated WebKit diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-mobile-isolated-${{ github.sha }}
          path: |
            webkit-mobile-isolated-*.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  webkit-version-comparison:
    name: WebKit version comparison - ${{ matrix.playwright }}
    runs-on: ubuntu-latest
    # Preinstalled Linux browser dependencies; keep browser tests and versions intact.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Browser engine comparison only; do not modify project lockfiles.
        playwright: ['1.64.1', '1.65.0-alpha-2026-10-15']
    env:
      PLAYWRIGHT_ALL_BROWSERS: 'true'
      PLAYWRIGHT_PROBE_VERSION: ${{ matrix.playwright }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - name: Install alternative browser driver without changing committed dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-fund "@playwright/test@${PLAYWRIGHT_PROBE_VERSION}"
          node -e 'const got=require("@playwright/test/package.json").version; if(got!==process.env.PLAYWRIGHT_PROBE_VERSION) { console.error("Unexpected Playwright version: "+got); process.exit(1) }'
          # Checkout's temporary HOME does not persist as a trusted Git path
          # in container steps; make the ownership exception explicit and scoped.
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- package.json package-lock.json
          npx playwright --version
      - name: Install matching WebKit and system dependencies
        working-directory: frontend
        run: npx playwright install webkit
      # The experimental WebKit's first browser.newPage() can take >20 seconds
      # on a cold Linux runner. Run a bounded, independently failing browser
      # health probe before Playwright begins its 30-second application tests.
      # The actual five tests retain their original timeout, assertions and
      # no-retry policy; a failing cold startup cannot silently pass.
      - name: Validate cold WebKit page startup separately
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s node --input-type=module <<'NODE'
          import { webkit } from '@playwright/test';

          const startedAt = performance.now();
          const browser = await webkit.launch({ timeout: 45_000 });
          try {
            const context = await browser.newContext();
            try {
              const page = await context.newPage();
              await page.goto('about:blank');
              const ready = await page.evaluate(() => document.readyState);
              if (ready !== 'complete') {
                throw new Error(`WebKit cold startup did not finish: ${ready}`);
              }
              console.log(`WebKit cold browser/page startup: ${Math.round(performance.now() - startedAt)}ms`);
            } finally {
              await context.close();
            }
          } finally {
            await browser.close();
          }
          NODE
      - name: Compare unmodified mobile product journey across five fresh contexts
        working-directory: frontend
        shell: bash
        env:
          DEBUG: pw:browser
        run: |
          set -euo pipefail
          npx playwright test e2e/admin-catalog-reference.spec.ts \
            --project=webkit \
            --grep='preço meio a meio dispensa valor fixo no cadastro em 390px' \
            --repeat-each=5 \
            2>&1 | tee "../webkit-version-${PLAYWRIGHT_PROBE_VERSION}.log"
      - name: Preserve comparison browser logs and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-version-${{ matrix.playwright }}-${{ github.sha }}
          path: |
            webkit-version-*.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  cross-browser-validation:
    name: Cross-browser Critical Validation
    if: ${{ always() }}
    needs: [portable-browser, catalog-webkit-regression, catalog-other-engines, catalog-repeatability, webkit-mobile-crash-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require all browser engines to pass
        env:
          PORTABLE_RESULT: ${{ needs.portable-browser.result }}
          CATALOG_RESULT: ${{ needs.catalog-webkit-regression.result }}
          CATALOG_OTHER_ENGINES_RESULT: ${{ needs.catalog-other-engines.result }}
          CATALOG_REPEATABILITY_RESULT: ${{ needs.catalog-repeatability.result }}
          WEBKIT_ISOLATED_RESULT: ${{ needs.webkit-mobile-crash-isolation.result }}
        run: |
          set -euo pipefail
          test "$PORTABLE_RESULT" = 'success'
          test "$CATALOG_RESULT" = 'success'
          test "$CATALOG_OTHER_ENGINES_RESULT" = 'success'
          test "$CATALOG_REPEATABILITY_RESULT" = 'success'
          test "$WEBKIT_ISOLATED_RESULT" = 'success'