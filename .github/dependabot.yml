version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Fortaleza
    open-pull-requests-limit: 10
    groups:
      backend-production:
        dependency-type: production
        update-types: [minor, patch]
      backend-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: America/Fortaleza
    open-pull-requests-limit: 10
    groups:
      frontend-production:
        dependency-type: production
        update-types: [minor, patch]
      frontend-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /print-agent
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Fortaleza
    open-pull-requests-limit: 10
    groups:
      print-agent-production:
        dependency-type: production
        update-types: [minor, patch]
      print-agent-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:45'
      timezone: America/Fortaleza
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']
