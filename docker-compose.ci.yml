services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gastronexa_ci
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gastronexa_ci']
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment: &backend_environment
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gastronexa_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/gastronexa_ci?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-1234567890
      JWT_MFA_SECRET: ci-only-mfa-secret-not-for-production-1234567890
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:8080
      SOCKET_CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      ALLOW_LOCAL_AUTH_CODE_LOGGING: 'false'
      OPENAI_API_KEY: ''
      MP_ACCESS_TOKEN: ''
      PAGBANK_TOKEN: ''
      ASAAS_API_KEY: ''
      SMTP_HOST: ''
      SENTRY_DSN: ''
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
    command: ['sh', '-c', './node_modules/.bin/prisma migrate deploy && node dist/server.js']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - '3000:3000'

  worker:
    build:
      context: ./backend
    environment: *backend_environment
    command: ['node', 'dist/worker.js']
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SOCKET_URL: http://localhost:3000
        VITE_QR_BASE_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '8080:80'
