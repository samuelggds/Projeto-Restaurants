services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ci_owner
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_DB: gastronexa_ci
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ci_owner -d gastronexa_ci']
      interval: 5s
      timeout: 5s
      retries: 12
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'

  migrate:
    build:
      context: ./backend
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_owner:ci-owner-password@postgres:5432/gastronexa_ci?schema=public
      DIRECT_URL: postgresql://ci_owner:ci-owner-password@postgres:5432/gastronexa_ci?schema=public
      RUNTIME_DATABASE_URL: postgresql://ci_runtime:ci-runtime-password-long-enough@postgres:5432/gastronexa_ci?schema=public
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy && node scripts/provisionRuntimeRole.mjs',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment: &backend_environment
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ci_runtime:ci-runtime-password-long-enough@postgres:5432/gastronexa_ci?schema=public
      RLS_VERIFY_RUNTIME_ROLE: 'true'
      JWT_SECRET: ci-only-jwt-secret-not-for-production-1234567890
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-1234567890
      JWT_MFA_SECRET: ci-only-mfa-secret-not-for-production-1234567890
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGINS: http://localhost:8080
      SOCKET_CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      ALLOW_LOCAL_AUTH_CODE_LOGGING: 'false'
      DISTRIBUTED_STATE: postgres
      API_REPLICA_COUNT: '1'
      OPENAI_API_KEY: ''
      MP_ACCESS_TOKEN: ''
      ASAAS_API_KEY: ''
      SMTP_HOST: ''
      SENTRY_DSN: ''
      PRISMA_HIDE_UPDATE_MESSAGE: 'true'
    command: ['node', 'dist/server.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - '3000:3000'

  worker:
    build:
      context: ./backend
    environment: *backend_environment
    command: ['node', 'dist/worker.js']
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SOCKET_URL: http://localhost:3000
        VITE_QR_BASE_URL: http://localhost:8080
        VITE_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '8080:80'
