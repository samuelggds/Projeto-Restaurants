services:
  db:
    image: postgres:16-alpine
    container_name: pizza_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pizza_ia}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pizza_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pizza_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/pizza_ia}
      JWT_SECRET: ${JWT_SECRET:-change_me_at_least_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_min_32_chars}
      JWT_MFA_SECRET: ${JWT_MFA_SECRET:-change_me_mfa_secret_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-14d}
      JWT_MFA_EXPIRES_IN: ${JWT_MFA_EXPIRES_IN:-10m}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SOCKET_CORS_ORIGINS: ${SOCKET_CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-50}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX_REQUESTS: ${LOGIN_RATE_LIMIT_MAX_REQUESTS:-8}
      LOGIN_LOCKOUT_AFTER_FAILURES: ${LOGIN_LOCKOUT_AFTER_FAILURES:-5}
      LOGIN_LOCKOUT_BASE_SECONDS: ${LOGIN_LOCKOUT_BASE_SECONDS:-60}
      LOGIN_LOCKOUT_MAX_SECONDS: ${LOGIN_LOCKOUT_MAX_SECONDS:-3600}
      LOGIN_LOCKOUT_STATE_TTL_MS: ${LOGIN_LOCKOUT_STATE_TTL_MS:-86400000}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-ADMIN,SUPER_ADMIN}
      MFA_CODE_TTL_MIN: ${MFA_CODE_TTL_MIN:-10}
      ALLOW_INSECURE_STRIPE_WEBHOOK: ${ALLOW_INSECURE_STRIPE_WEBHOOK:-false}
      ALLOW_GLOBAL_PAYMENT_FALLBACK: ${ALLOW_GLOBAL_PAYMENT_FALLBACK:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-}
      ROUTING_USER_AGENT: ${ROUTING_USER_AGENT:-PizzaIADelivery/1.0}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      ALERT_PROVIDER: ${ALERT_PROVIDER:-email}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_AUTH_TYPE: ${SMTP_AUTH_TYPE:-basic}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_CLIENT_ID: ${SMTP_CLIENT_ID:-}
      SMTP_CLIENT_SECRET: ${SMTP_CLIENT_SECRET:-}
      SMTP_REFRESH_TOKEN: ${SMTP_REFRESH_TOKEN:-}
      SMTP_ACCESS_TOKEN: ${SMTP_ACCESS_TOKEN:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
    container_name: pizza_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
